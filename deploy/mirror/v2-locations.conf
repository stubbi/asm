# Replace the V1 downloads.conf include with this file for a V2-only origin.
# Mount only the public mirror at /srv/asm. Keep nginx.conf's default 404 route.
# TLS terminates at the selected HTTPS ingress. Only canonical selections log.
# SPDX-License-Identifier: AGPL-3.0-or-later
location /metadata/ {
    alias /srv/asm/metadata/;
    default_type application/json;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
}
location /targets/ {
    alias /srv/asm/targets/;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Disposition attachment;
}
location /blobs/sha256/ {
    alias /srv/asm/blobs/sha256/;
    access_log /var/log/asm/downloads-v2.jsonl asm_delivery if=$asm_v2_loggable;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Disposition attachment;
}
