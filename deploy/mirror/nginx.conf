# Static artifact origin reference. Terminate public TLS at the ingress.
# Run with a read-only artifact volume and a private writable log volume.
# SPDX-License-Identifier: AGPL-3.0-or-later
daemon off;
worker_processes auto;
pid /tmp/asm-nginx.pid;
# Request errors can contain private URLs. Use health probes for this origin.
error_log /dev/null;
env TZ=UTC;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;
    large_client_header_buffers 2 4k;
    # Override distribution-specific absolute defaults. Select an owned private
    # nginx -p prefix, separate from the public artifact and private log mounts.
    client_body_temp_path client-body;
    proxy_temp_path proxy;
    fastcgi_temp_path fastcgi;
    uwsgi_temp_path uwsgi;
    scgi_temp_path scgi;
    sendfile on;
    sendfile_max_chunk 1m;
    max_ranges 1;
    disable_symlinks on;

    # Classification is advisory. This default excludes no unknown automation.
    # Do not classify from a caller-supplied traffic header.
    map $http_user_agent $asm_traffic {
        default public;
        ~*^AsmValidation/ internal;
        ~*(bot|crawler|spider) bot;
    }
    # Inspect the complete original path/query, never the ambiguous $arg_x_asm.
    # Only these public selection fields can enter the normalized V2 log.
    map $request_uri $asm_v2_selection {
        default "";
        "~^/(?:(?![.]{1,2}/)[A-Za-z0-9._~-]+/)*blobs/sha256/(?<asm_v2_sha>[0-9a-f]{64})[?]x-asm=(?<asm_v2_registry>[0-9a-f]{32})[.](?<asm_v2_package>[0-9a-f]{32})[.](?<asm_v2_release>[0-9a-f]{32})[.](?<asm_v2_target>x86_64-linux|aarch64-linux|riscv64-linux|aarch64-macos|x86_64-windows|aarch64-windows)[.](?<asm_v2_kind>source|executable)$"
            "/downloads/v2/$asm_v2_registry/$asm_v2_package/$asm_v2_release/$asm_v2_target/$asm_v2_kind/$asm_v2_sha";
    }
    map $asm_v2_selection $asm_v2_loggable {
        "" 0;
        default 1;
    }
    map $asm_v2_selection $asm_delivery_uri {
        "" $uri;
        default $asm_v2_selection;
    }
    log_format asm_delivery escape=json
        '{"time":"$time_iso8601","request_id":"$request_id",'
        '"method":"$request_method","uri":"$asm_delivery_uri","status":$status,'
        '"bytes":$body_bytes_sent,"complete":"$request_completion",'
        '"traffic":"$asm_traffic"}';

    server {
        listen 8080;
        server_name _;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        add_header X-Content-Type-Options nosniff always;

        location = /health/live {
            default_type text/plain;
            add_header Cache-Control no-store always;
            return 200 "ok\n";
        }

        # Generate this include from the accepted snapshot's retained records.
        include /etc/nginx/asm/downloads.conf;

        # Raw digests, SQLite state, logs and mutable heads are not public routes.
        location / { return 404; }
    }
}
