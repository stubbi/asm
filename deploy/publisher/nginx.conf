# Run as an unprivileged account with a private writable -p prefix.
daemon off;
worker_processes 1;
pid nginx.pid;
# NGINX errors can contain private request URLs and headers.
error_log /dev/null;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path client_body;
    proxy_temp_path proxy_temp;
    fastcgi_temp_path fastcgi_temp;
    uwsgi_temp_path uwsgi_temp;
    scgi_temp_path scgi_temp;

    # Match the original request target, before NGINX path normalization.
    # Queries, escapes, duplicate slashes, and dot segments are not API routes.
    map "$request_method:$request_uri" $asm_public_route {
        default 0;
        "GET:/api/v2/status" 1;
        "POST:/api/v2/publications" 1;
        "~^GET:/api/v2/publications/[0-9a-f]{32}$" 1;
        "~^PUT:/api/v2/publications/[0-9a-f]{32}/artifacts/[0-9a-f]{64}$" 1;
    }
    map "$request_method:$http_content_length" $asm_missing_length {
        default 0;
        "POST:" 1;
        "PUT:" 1;
    }
    map "$request_method:$request_uri" $asm_private_probe {
        default 0;
        "GET:/health/live" 1;
        "GET:/health/ready" 1;
    }
    limit_conn_zone $server_port zone=publisher:32k;

    server {
        listen 8081 default_server;
        server_name _;

        if ($asm_public_route = 0) { return 404; }
        if ($http_transfer_encoding != "") { return 400; }
        if ($asm_missing_length = 1) { return 411; }

        client_header_buffer_size 1k;
        large_client_header_buffers 2 4k;
        client_header_timeout 5s;
        client_body_timeout 5s;
        client_max_body_size 64k;
        client_body_buffer_size 16k;
        keepalive_timeout 0;
        send_timeout 10s;
        lingering_timeout 1s;
        lingering_time 2s;
        reset_timedout_connection on;
        limit_conn publisher 16;
        limit_conn_status 429;

        proxy_http_version 1.1;
        # Preserve duplicates for the assembly admission check. Rebuilding fields
        # from $http_* variables can conceal repeated headers on some versions.
        proxy_pass_request_headers on;
        proxy_set_header Host 127.0.0.1:8080;
        proxy_set_header Connection close;
        proxy_set_header Content-Length $http_content_length;
        proxy_set_header Cookie "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_ignore_client_abort off;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_store off;
        proxy_redirect off;
        proxy_intercept_errors off;
        proxy_ignore_headers X-Accel-Redirect X-Accel-Buffering;
        proxy_hide_header Cache-Control;
        add_header Cache-Control no-store always;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        # This is an idle timeout. The assembly publisher enforces its 60s deadline.
        proxy_read_timeout 65s;

        location ~ "^/api/v2/publications/[0-9a-f]{32}/artifacts/[0-9a-f]{64}$" {
            client_max_body_size 64m;
            # No URI component: preserve the accepted original request target.
            proxy_pass http://127.0.0.1:8080;
        }
        location / {
            proxy_pass http://127.0.0.1:8080;
        }
    }

    # Kubelet probes the Pod IP. Keep this port outside every public Service
    # and Ingress, and restrict Pod traffic through enforced NetworkPolicy.
    server {
        listen 8082 default_server;
        server_name _;
        if ($asm_private_probe = 0) { return 404; }
        if ($http_transfer_encoding != "") { return 400; }
        if ($http_content_length !~ "^(0)?$") { return 400; }
        client_header_buffer_size 1k;
        large_client_header_buffers 2 4k;
        client_header_timeout 2s;
        client_body_timeout 2s;
        client_max_body_size 1k;
        keepalive_timeout 0;
        send_timeout 3s;
        reset_timedout_connection on;
        limit_conn publisher 4;
        limit_conn_status 429;

        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host 127.0.0.1:8080;
        proxy_set_header Connection close;
        proxy_set_header Content-Length "";
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_ignore_client_abort off;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_store off;
        proxy_redirect off;
        proxy_intercept_errors off;
        proxy_ignore_headers X-Accel-Redirect X-Accel-Buffering;
        proxy_hide_header Cache-Control;
        add_header Cache-Control no-store always;
        proxy_connect_timeout 1s;
        proxy_send_timeout 2s;
        proxy_read_timeout 3s;

        location / {
            proxy_pass http://127.0.0.1:8080;
        }
    }
}
