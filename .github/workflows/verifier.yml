name: Verify distribution trust

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: verifier/go.mod
          cache-dependency-path: verifier/go.sum
      - name: Check signatures, freshness, rotation, and publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/verifier-evidence
          make verifier-test 2>&1 | tee build/verifier-evidence/tests.log
      - name: Select Ed25519 fixture cryptography on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew list --versions openssl@3 >/dev/null || brew install openssl@3
          ASM_TEST_OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          "$ASM_TEST_OPENSSL" version
          printf 'ASM_REGISTRY_OPENSSL=%s\n' "$ASM_TEST_OPENSSL" >> "$GITHUB_ENV"
      - name: Check native publication, exact installation, and mirror selection
        shell: bash
        run: |
          set -euo pipefail
          make registry-v2-test 2>&1 | tee build/verifier-evidence/registry-v2.log
      - name: Bind native results to executable bytes
        if: always()
        shell: bash
        run: |
          mkdir -p build/verifier-evidence
          python3 - <<'PY' > build/verifier-evidence/artifacts.json
          import hashlib, json, os
          from pathlib import Path
          paths = [Path('build/asm-registry-v2'), Path('build/asm-trust')]
          paths += sorted(Path('build').glob('asm-verify-*'))
          artifacts = {str(p): {'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
                       for p in paths if p.is_file()}
          print(json.dumps({'schema': 1, 'source_commit': os.environ['GITHUB_SHA'], 'artifacts': artifacts}, sort_keys=True))
          PY
      - name: Retain native verifier results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-verifier-${{ matrix.runner }}-${{ github.sha }}
          path: build/verifier-evidence/
          if-no-files-found: error
          retention-days: 90

  windows:
    name: Verify native Windows ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-windows
            architecture: x64
          - runner: windows-11-arm
            target: aarch64-windows
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: verifier/go.mod
          architecture: ${{ matrix.architecture }}
          cache: false
      - name: Check evidence refusal and bounded process capture
        run: |
          New-Item -ItemType Directory -Force -Path build/windows-verifier-checks | Out-Null
          python -m unittest discover -s tests/release -p test_windows_verifier_gate.py -v 2>&1 | Tee-Object -FilePath build/windows-verifier-checks/unit-tests.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run the complete native verifier suite
        env:
          ASM_VERIFIER_TARGET: ${{ matrix.target }}
        run: |
          python tools/windows_verifier_test.py --target $env:ASM_VERIFIER_TARGET --source-commit $env:GITHUB_SHA --evidence build/windows-verifier-evidence
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain native results including failures and skipped paths
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-windows-verifier-${{ matrix.target }}-${{ github.sha }}
          path: |
            build/windows-verifier-checks/*
            build/windows-verifier-evidence/*
          if-no-files-found: error
          retention-days: 90

  required:
    name: Test distribution trust
    needs: [verify, windows]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require every verifier target
        env:
          UNIX_RESULT: ${{ needs.verify.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          test "$UNIX_RESULT" = success
          test "$WINDOWS_RESULT" = success
