name: UNQUALIFIED native reference self-tests

# This diagnostic compiles fixed synthetic test code. It cannot publish an image.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-native-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
      - name: Install the native headers recorded by the failed run
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-compile-evidence
          printf '%s\n' '{"schema":1,"qualification":"UNQUALIFIED","outcome":"fail","phase":"not-completed"}' > native-compile-evidence/initial-report.json
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libmicrohttpd-dev=1.0.0-2.1ubuntu2 libpq-dev=18.6-1.pgdg24.04+2
          dpkg-query --show gcc gcc-13 libmicrohttpd-dev libpq-dev > native-compile-evidence/packages.txt
      - name: Compile the unchanged synthetic provider and retain its diagnosis
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from datetime import datetime, timezone
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re
          import shlex
          import shutil
          import sys
          import tempfile
          import time
          sys.path.insert(0, "tools")
          from riscv64_combined import bounded_process

          output = Path("native-compile-evidence").resolve()
          deadline = time.monotonic() + 45
          report = {"schema": 1, "scope": "native-synthetic-provider-compile", "qualification": "UNQUALIFIED",
              "outcome": "fail", "probe_revision": os.environ["GITHUB_SHA"],
              "failed_run": 42087407347, "failed_source": "cf250b9815a2113914e723222f7da2617a45f75f",
              "commands": [], "application_executed": False, "target_executed": False,
              "original_19_test_gate": "fail", "separate_canonical_16_failure_run": 42077456215}
          try:
              source = Path("tests/riscv64/test_reference_trace.py").read_bytes()
              report["fixture_source_sha256"] = hashlib.sha256(source).hexdigest()
              if report["fixture_source_sha256"] != "bdb8907850fe0da8ffff138636645f980b643e64d529a1dc690b05828a7179dd":
                  raise ValueError("The fixed synthetic fixture differs.")
              spec = importlib.util.spec_from_file_location("frozen_reference_trace", "tests/riscv64/test_reference_trace.py")
              fixture = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(fixture)
              provider = fixture.PROVIDER.encode()
              if not 0 < len(provider) <= 262144:
                  raise ValueError("The provider literal exceeds its bound.")
              report["provider_sha256"] = hashlib.sha256(provider).hexdigest()
              compiler = Path(shutil.which("cc")).resolve(strict=True)
              if not compiler.is_file() or compiler.stat().st_size > 134217728:
                  raise ValueError("The native compiler is unavailable or oversized.")
              report["compiler"] = {"path": str(compiler), "bytes": compiler.stat().st_size,
                  "sha256": hashlib.sha256(compiler.read_bytes()).hexdigest()}
              with tempfile.TemporaryDirectory(prefix="asm-native-provider-") as private:
                  private = Path(private)
                  environment = ["/usr/bin/env", "-i", "PATH=/usr/bin:/bin", "LC_ALL=C", "LANG=C",
                      "HOME=" + str(private), "TMPDIR=" + str(private)]
                  def command(label, arguments, limit=16384):
                      remaining = min(20, deadline - time.monotonic())
                      if remaining <= 0:
                          raise ValueError("The native probe deadline expired.")
                      log = output / (label + ".log")
                      result = bounded_process([*environment, *map(str, arguments)], log,
                          timeout=remaining, max_bytes=limit)
                      report["commands"].append({"label": label, "arguments": list(map(str, arguments)),
                          **result, "log_sha256": hashlib.sha256(log.read_bytes()).hexdigest()})
                      return result, log
                  for label, args in (("compiler-version", [compiler, "--version"]),
                      ("compiler-target", [compiler, "-dumpmachine"]),
                      ("header-versions", ["/usr/bin/pkg-config", "--modversion", "libmicrohttpd", "libpq"])):
                      result, _ = command(label, args)
                      if result["outcome"] != "pass":
                          raise ValueError("Native compiler or header identification failed.")
                  result, flags = command("header-flags", ["/usr/bin/pkg-config", "--cflags", "libmicrohttpd", "libpq"])
                  if result["outcome"] != "pass":
                      raise ValueError("Native header flags are unavailable.")
                  provider_path = private / "provider.c"
                  provider_path.write_bytes(provider)
                  arguments = [compiler, "-std=c11", "-Wall", "-Wextra", "-Werror", "-fPIC", "-pthread",
                      *shlex.split(flags.read_text()), "-shared", provider_path, "-o", private / "libprovider.so", "-ldl"]
                  result, log = command("provider-compile", arguments, 65536)
                  report["outcome"] = result["outcome"]
                  if result["outcome"] == "pass":
                      library = private / "libprovider.so"
                      if not library.is_file() or library.stat().st_size > 1048576:
                          raise ValueError("The synthetic library is unavailable or oversized.")
                      report["library"] = {"bytes": library.stat().st_size,
                          "sha256": hashlib.sha256(library.read_bytes()).hexdigest()}
                  headers = ("/usr/include/microhttpd.h", "/usr/include/postgresql/libpq-fe.h",
                      "/usr/include/postgresql/postgres_ext.h", "/usr/include/postgresql/pg_config_ext.h")
                  report["headers"], report["missing_header_paths"] = {}, []
                  for name in headers:
                      path = Path(name)
                      try:
                          size = path.stat().st_size
                      except FileNotFoundError:
                          report["missing_header_paths"].append(name)
                          continue
                      if not 0 < size <= 1048576:
                          raise ValueError("A native public header exceeds its byte bound.")
                      report["headers"][name] = {"bytes": size,
                          "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
                  report["diagnostics"] = []
                  for line in log.read_text(errors="replace").splitlines():
                      match = re.match(r".*provider\.c:([0-9]+):([0-9]+): (error|warning|note):", line)
                      if match:
                          category = re.search(r"\[(-W[a-zA-Z0-9=\-]+)\]", line)
                          report["diagnostics"].append({"file": "provider.c", "line": int(match[1]),
                              "column": int(match[2]), "severity": match[3],
                              "category": category[1] if category else "unclassified"})
          except Exception as error:
              report.update(outcome="fail", failure_type=type(error).__name__)
          finally:
              if time.monotonic() > deadline:
                  report.update(outcome="fail", deadline_exceeded=True)
              report["recorded_at"] = datetime.now(timezone.utc).isoformat()
              (output / "probe.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
              print("ASM_NATIVE_COMPILE_PROBE=" + json.dumps(report, separators=(",", ":")))
          raise SystemExit(0 if report["outcome"] == "pass" else 1)
          PYTHON
      - name: Run all 53 native reference checks with bounded compiler diagnostics
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools")
          from riscv64_combined import bounded_process
          child = r'''
          import hashlib, json, subprocess, unittest
          from pathlib import Path
          output = Path("native-compile-evidence")
          diagnostics = []
          class Result(unittest.TextTestResult):
              def addError(self, test, error):
                  failure = error[1]
                  if (isinstance(failure, subprocess.CalledProcessError) and
                          isinstance(failure.cmd, list) and failure.cmd and failure.cmd[0] == "cc"):
                      if len(diagnostics) >= 3:
                          raise RuntimeError("The native compiler error count exceeds its bound.")
                      raw = (failure.stdout or b"") + (failure.stderr or b"")
                      name = "native-compiler-error-" + str(len(diagnostics) + 1) + ".log"
                      with (output / name).open("xb") as stream:
                          stream.write(raw[:65536])
                      diagnostics.append({"path": name, "exit_code": failure.returncode,
                          "arguments": failure.cmd, "bytes": len(raw), "retained_bytes": min(len(raw), 65536),
                          "sha256": hashlib.sha256(raw).hexdigest(), "truncated": len(raw) > 65536})
                  super().addError(test, error)
          suite = unittest.defaultTestLoader.discover("tests/riscv64", pattern="test_reference_*.py")
          if suite.countTestCases() != 53:
              raise RuntimeError("Require the selected 53 native reference checks.")
          result = unittest.TextTestRunner(verbosity=2, resultclass=Result).run(suite)
          report = {"schema": 1, "qualification": "UNQUALIFIED", "tests_run": result.testsRun,
              "failures": len(result.failures), "errors": len(result.errors), "skipped": len(result.skipped),
              "expected_failures": len(result.expectedFailures), "compiler_diagnostics": diagnostics}
          passed = result.wasSuccessful() and result.testsRun == 53 and not result.skipped and not result.expectedFailures
          report["outcome"] = "pass" if passed else "fail"
          (output / "native-tests.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          raise SystemExit(0 if passed else 1)
          '''
          # Dedent the fixed child without changing its statements or assertions.
          import textwrap
          source = Path(os.environ["RUNNER_TEMP"]) / "asm-native-reference-selftests.py"
          source.write_text(textwrap.dedent(child))
          output = Path("native-compile-evidence")
          result = bounded_process([sys.executable, source], output / "reference-self-tests.log",
              cwd=Path.cwd(), timeout=50, max_bytes=1048576)
          (output / "native-test-process.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print("ASM_NATIVE_REFERENCE_TESTS=" + json.dumps(result, separators=(",", ":")))
          raise SystemExit(0 if result["outcome"] == "pass" else 1)
          PYTHON
      - name: Retain bounded host compile evidence
        timeout-minutes: 1
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UNQUALIFIED-native-provider-compile-${{ github.sha }}-${{ github.run_id }}
          path: native-compile-evidence/
          if-no-files-found: error
          retention-days: 14
