name: RISC-V concurrency diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riscv-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ASM_APPLICATION_SOURCE: 437fa424157d5e884a11bd2643b1eaca71674fc1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check isolation and the diagnostic before the long build
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 diagnostic-evidence
          git rev-parse HEAD > diagnostic-evidence/diagnostic-checkout.txt
          printf '%s\n' "$ASM_APPLICATION_SOURCE" > diagnostic-evidence/application-source.txt
          git fetch --no-tags origin "$ASM_APPLICATION_SOURCE"
          git diff --exit-code "$ASM_APPLICATION_SOURCE" -- server containers/server.Dockerfile \
            tools/test_server_image.py tools/registry.py tools/registry_admin.py registry/packages \
            experiments/assembly-server
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libpq-dev
          python3 tools/diagnostics/test_probe.py 2>&1 | tee diagnostic-evidence/native-checks.log
          git ls-tree "$ASM_APPLICATION_SOURCE" -- server registry/packages containers/server.Dockerfile \
            tools/test_server_image.py tools/registry.py tools/registry_admin.py \
            experiments/assembly-server > diagnostic-evidence/frozen-input-objects.txt
          cc --version > diagnostic-evidence/host-compiler.txt
          pkg-config --modversion libpq > diagnostic-evidence/host-header-version.txt
      - name: Install the same pinned RISC-V user emulator
        shell: bash
        run: |
          set -euo pipefail
          ASM_QEMU_DEB="$RUNNER_TEMP/asm-qemu-user-static.deb"
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 120 \
            --output "$ASM_QEMU_DEB" \
            https://archive.ubuntu.com/ubuntu/pool/universe/q/qemu/qemu-user-static_8.2.2+ds-0ubuntu1.18_amd64.deb
          printf '%s  %s\n' 5bb397f66063efa349f6fd5cb3b68cd96f29edd0994e4ba5115cf0859a716bf0 "$ASM_QEMU_DEB" | sha256sum --check --strict
          test "$(dpkg-deb --field "$ASM_QEMU_DEB" Version)" = '1:8.2.2+ds-0ubuntu1.18'
          sudo apt-get install --no-install-recommends --yes "$ASM_QEMU_DEB"
          printf '%s  %s\n' be89e201dc6112ef101617ab575c95119ad123f80ca2b51b6c36ef218ac9df65 /usr/bin/qemu-riscv64-static | sha256sum --check --strict
          if ! test -e /proc/sys/fs/binfmt_misc/register; then
            sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          fi
          sudo /usr/lib/systemd/systemd-binfmt /usr/lib/binfmt.d/qemu-riscv64.conf
          grep -Fx 'interpreter /usr/libexec/qemu-binfmt/riscv64-binfmt-P' /proc/sys/fs/binfmt_misc/qemu-riscv64
          test "$(readlink -f /usr/libexec/qemu-binfmt/riscv64-binfmt-P)" = /usr/bin/qemu-riscv64-static
          grep -Eq '^flags: .*F' /proc/sys/fs/binfmt_misc/qemu-riscv64
      - name: Record the rebuilt execution environment
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            docker version
            docker buildx version
            /usr/bin/qemu-riscv64-static --version
            sha256sum /usr/bin/qemu-riscv64-static
            dpkg-query --show qemu-user-static systemd
            cat /proc/sys/fs/binfmt_misc/qemu-riscv64
          } > diagnostic-evidence/environment.txt
      - name: Rebuild the unchanged runtime and a derived diagnostic layer
        shell: bash
        run: |
          set -euo pipefail
          ASM_DIAGNOSTIC_RECIPE="$RUNNER_TEMP/server-diagnostic.Dockerfile"
          cp containers/server.Dockerfile "$ASM_DIAGNOSTIC_RECIPE"
          cat >> "$ASM_DIAGNOSTIC_RECIPE" <<'DOCKERFILE'
          FROM build AS diagnostic-build
          COPY tools/diagnostics/libpq_trace.c /diagnostic/libpq_trace.c
          RUN cc -std=c11 -Wall -Wextra -Werror -fPIC -shared -pthread \
              -I/opt/asm/postgres/include -o /diagnostic/libpq_trace.so /diagnostic/libpq_trace.c -ldl
          FROM qualification AS diagnostic
          COPY --from=diagnostic-build /diagnostic/libpq_trace.so /diagnostic/libpq_trace.so
          COPY tools/diagnostics/riscv_probe.py /diagnostic/riscv_probe.py
          DOCKERFILE
          docker build --platform linux/riscv64 --file "$ASM_DIAGNOSTIC_RECIPE" \
            --build-arg ASM_SOURCE_REVISION="$ASM_APPLICATION_SOURCE" --target runtime \
            --tag asm-server:diagnostic-runtime . 2>&1 | tee diagnostic-evidence/build-runtime.log
          docker build --platform linux/riscv64 --file "$ASM_DIAGNOSTIC_RECIPE" \
            --build-arg ASM_SOURCE_REVISION="$ASM_APPLICATION_SOURCE" --target diagnostic \
            --tag asm-server:diagnostic . 2>&1 | tee diagnostic-evidence/build-diagnostic.log
      - name: Observe the original wave twice with fixed limits and assertions
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/diagnostics/riscv_probe.py --diagnostic-checkout "$GITHUB_SHA" \
            --runtime asm-server:diagnostic-runtime --diagnostic-image asm-server:diagnostic \
            --output diagnostic-evidence/observations.json
      - name: Retain diagnostic observations after success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: riscv-concurrency-diagnostic-${{ github.sha }}
          path: diagnostic-evidence/
          if-no-files-found: error
          retention-days: 7
