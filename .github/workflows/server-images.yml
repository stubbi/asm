name: Canonical RISC-V phase diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: canonical-riscv-phases-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    name: Observe the unqualified canonical RISC-V candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install diagnostic prerequisites
        timeout-minutes: 4
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross binutils-riscv64-linux-gnu \
            qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-riscv64
      - name: Prepare and observe within one 600-second host budget
        timeout-minutes: 11
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          GH_NO_UPDATE_NOTIFIER: "1"
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import time

          # Prerequisite installation and artifact upload are outside this timer.
          # Collection and container removal share its reserved final 90 seconds.
          started = time.monotonic_ns()
          deadline = started + 600_000_000_000
          temporary = Path(os.environ["RUNNER_TEMP"])
          receipt_directory = temporary / "asm-canonical-workflow-evidence"
          receipt_directory.mkdir(mode=0o700)
          receipt = {"schema": 1, "scope": "canonical-riscv-workflow",
                     "qualification": "UNQUALIFIED", "status": "fail",
                     "started_ns": started, "deadline_ns": deadline, "commands": []}
          phase = "sdk"
          sdk = temporary / "asm-canonical-sdk"
          inputs = temporary / "asm-canonical-inputs"
          context = temporary / "asm-canonical-context"
          output = temporary / "asm-canonical-evidence"
          inputs.mkdir(mode=0o700)

          def remaining(maximum=120, reserve=90):
              value = (deadline - time.monotonic_ns()) / 1e9 - reserve
              if value <= 0:
                  raise TimeoutError("The shared diagnostic budget expired.")
              return min(maximum, value)

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as source:
                  while data := source.read(131072):
                      digest.update(data)
              return digest.hexdigest()

          def verify(path, size, expected):
              if path.stat().st_size != size:
                  raise ValueError("A diagnostic input has the wrong size.")
              if sha256(path) != expected:
                  raise ValueError("A diagnostic input has the wrong digest.")
              remaining()

          try:
              # Reuse exactly three reviewed helper blobs without importing a
              # second mutable checkout or copying the SDK into this branch.
              worker = (
                  "from pathlib import Path; import sys; sys.path.insert(0,'tools'); "
                  "import registry,release; "
                  "names=['tools/riscv64_combined.py','tools/riscv64_server_observations.py',"
                  "'tools/riscv64_reference_build.py']; "
                  "files=registry.git_files(Path.cwd(),"
                  "'881208fcec32ec8fe4609747ca2c4d8b9065c49f','.',names); "
                  "registry.require(set(files)==set(names),'The pinned SDK is incomplete.'); "
                  "release.materialize(files,Path(sys.argv[1]))")
              result = subprocess.run([sys.executable, "-c", worker, str(sdk)],
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                      timeout=remaining(30))
              receipt["commands"].append({"label": "materialize-sdk", "exit_code": result.returncode,
                                          "stdout_bytes": len(result.stdout), "stderr_bytes": len(result.stderr)})
              if result.returncode:
                  raise ValueError("The pinned SDK could not be materialized.")
              sys.path.insert(0, str(sdk / "tools"))
              from riscv64_combined import bounded_process

              def run(label, arguments, log, maximum, *, seconds=120, reserve=90):
                  value = bounded_process(arguments, log, timeout=remaining(seconds, reserve),
                                          max_bytes=maximum)
                  receipt["commands"].append({"label": label, **value,
                                              "log_sha256": sha256(log)})
                  if value["outcome"] != "pass":
                      raise ValueError("A bounded diagnostic command failed.")
                  remaining(600, reserve)

              configuration = inputs / "gh-config"
              configuration.mkdir(mode=0o700)
              os.environ["GH_CONFIG_DIR"] = str(configuration)
              phase = "image-download"
              image = inputs / "image.zip"
              run("download-image", ["gh", "api",
                  "repos/stubbi/asm/actions/artifacts/13423240467/zip"],
                  image, 84_388_799)
              verify(image, 84_388_798,
                     "e3e47e75585b85ab148ae8b596d73b6eca9dbedc0f1f7e6a2f0493e845b55817")
              phase = "mhd-download"
              mhd = inputs / "mhd-source.tar.gz"
              run("download-mhd", ["curl", "--disable", "--fail", "--silent", "--show-error",
                  "--location", "--proto", "=https", "--proto-redir", "=https",
                  "https://ftp.gnu.org/gnu/libmicrohttpd/libmicrohttpd-1.0.3.tar.gz"],
                  mhd, 2_102_294, seconds=60)
              verify(mhd, 2_102_293,
                     "7816b57aae199cf5c3645e8770e1be5f0a4dfafbcb24b3772173dc4ee634126a")
              os.environ.pop("GH_TOKEN", None)
              common = ["--revision", os.environ["GITHUB_SHA"], "--sdk", str(sdk),
                        "--started-ns", str(started), "--deadline-ns", str(deadline)]
              phase = "context"
              run("prepare-context", [sys.executable, "tools/canonical_riscv_phases.py",
                  "--prepare-context", str(context), *common],
                  inputs / "prepare.log", 1_048_576)
              phase = "observation"
              run("run-image", [sys.executable, "tools/canonical_riscv_phases.py",
                  "--run-image", "--context", str(context), "--image-zip", str(image),
                  "--mhd-source", str(mhd), "--output", str(output), *common],
                  inputs / "run.log", 1_048_576, seconds=600, reserve=0)
              receipt["status"] = "complete"
          except BaseException as error:
              receipt.update(phase=phase, exception_type=type(error).__name__)
              raise
          finally:
              receipt["elapsed_ns"] = time.monotonic_ns() - started
              (receipt_directory / "workflow.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
      - name: Retain bounded successful and failed diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonical-riscv-phases-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/asm-canonical-workflow-evidence/
            ${{ runner.temp }}/asm-canonical-evidence/
            ${{ runner.temp }}/asm-canonical-context/canonical-build-failure.json
            ${{ runner.temp }}/asm-canonical-context/canonical-build-failure.log
            ${{ runner.temp }}/asm-canonical-context/canonical-build/manifest.json
            ${{ runner.temp }}/asm-canonical-context/canonical-build/asm-hub
            ${{ runner.temp }}/asm-canonical-context/canonical-build/abi-check
            ${{ runner.temp }}/asm-canonical-context/canonical-build/canonical_libpq_trace.so
            ${{ runner.temp }}/asm-canonical-context/canonical-build/libcanonical_provider.so
            ${{ runner.temp }}/asm-canonical-context/canonical-build/canonical_trace_check
          if-no-files-found: error
          retention-days: 7
