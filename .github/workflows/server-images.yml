name: UNQUALIFIED RISC-V server observations

# This isolated branch diagnoses a failed gate. It cannot publish an image.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: riscv-server-observations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    name: Observe the unchanged 14 HTTP cases (UNQUALIFIED)
    runs-on: ubuntu-24.04
    # The inner host budget is 600 seconds, including evidence collection.
    # This outer budget also covers checkout, downloads, source selection, and upload.
    timeout-minutes: 35
    env:
      ASM_FIXTURE_REVISION: REVIEWED_FIXTURE_COMMIT_REQUIRED
      ASM_EVIDENCE: ${{ github.workspace }}/server-observations-evidence
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize failure evidence and check the diagnostic harness
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          export ASM_CONTEXT="$RUNNER_TEMP/asm-observations-context"
          export ASM_INPUTS="$RUNNER_TEMP/asm-observations-inputs"
          printf 'ASM_CONTEXT=%s\nASM_INPUTS=%s\n' "$ASM_CONTEXT" "$ASM_INPUTS" >> "$GITHUB_ENV"
          mkdir -p "$ASM_EVIDENCE" "$ASM_INPUTS"
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          report = {"schema": 1, "scope": "UNQUALIFIED-riscv-server-observations", "outcome": "fail",
                    "source_revision": os.environ["GITHUB_SHA"], "execution": "qemu-user",
                    "application_qualified": False, "native_qualified": False, "release_qualified": False,
                    "original_19_test_gate": "fail", "error": "The diagnostic has not completed."}
          Path(os.environ["ASM_EVIDENCE"], "initial-report.json").write_text(json.dumps(report, indent=2) + "\n")
          PYTHON
          python3 tools/riscv64_server_observations.py --self-test \
            2>&1 | tee "$ASM_EVIDENCE/self-tests.log"
      - name: Download only the two reviewed artifacts under exact byte bounds
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import time
          sys.path.insert(0, "tools")
          from riscv64_combined import bounded_process

          inputs = Path(os.environ["ASM_INPUTS"])
          evidence = Path(os.environ["ASM_EVIDENCE"])
          deadline = time.monotonic() + 240
          def remaining(limit):
              seconds = min(limit, deadline - time.monotonic())
              if seconds <= 0:
                  raise ValueError("The shared artifact download deadline expired.")
              return seconds
          pins = (
              ("image", 13423240467, 42035969713, "1b4f34899cbf67edba1cfc5ba7ed08ea97269f66", 84388798,
               "e3e47e75585b85ab148ae8b596d73b6eca9dbedc0f1f7e6a2f0493e845b55817"),
              # The API records the PR head; the retained receipt binds its tested merge separately.
              ("server", 13426312471, 42042426725, "66f432bb129c0c56922ec8edfa657e82b4fb9851", 27690874,
               "bc398de445a950e65f6cf1690dac89610129cf4c2ccc16b0ebb1997d4ff44136"),
          )
          for label, artifact, run, revision, size, digest in pins:
              endpoint = f"repos/stubbi/asm/actions/artifacts/{artifact}"
              metadata = evidence / (label + "-artifact.json")
              result = bounded_process(["gh", "api", endpoint], metadata, timeout=remaining(30), max_bytes=65536)
              if result["outcome"] != "pass":
                  raise ValueError("Cannot read the pinned artifact metadata.")
              receipt = json.loads(metadata.read_text())
              if (receipt["id"] != artifact or receipt["expired"] is not False
                      or receipt["size_in_bytes"] != size or receipt["digest"] != "sha256:" + digest
                      or receipt["workflow_run"]["id"] != run
                      or receipt["workflow_run"]["repository_id"] != 1441332955
                      or receipt["workflow_run"]["head_repository_id"] != 1441332955
                      or receipt["workflow_run"]["head_sha"] != revision):
                  raise ValueError("The artifact metadata differs from the reviewed pin.")
              archive = inputs / (label + ".zip")
              result = bounded_process(["gh", "api", endpoint + "/zip"], archive,
                                       timeout=remaining(180), max_bytes=size)
              if result["outcome"] != "pass" or archive.stat().st_size != size:
                  raise ValueError("The artifact download failed or has an unexpected byte size.")
              with archive.open("rb") as stream:
                  actual = hashlib.file_digest(stream, "sha256").hexdigest()
              if actual != digest:
                  raise ValueError("The artifact download differs from its reviewed digest.")
              remaining(1)
          PYTHON
      - name: Materialize the reviewed fixture and original package source
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$ASM_FIXTURE_REVISION" 04c93b3f0200173298d24f22a06393bc359a1af0
          python3 tools/riscv64_server_observations.py --prepare-context "$ASM_CONTEXT" \
            --revision "$GITHUB_SHA" --fixture-revision "$ASM_FIXTURE_REVISION"
          cp "$ASM_CONTEXT/input-manifest.json" "$ASM_EVIDENCE/input-manifest.json"
      - name: Install and verify the original pinned user emulator
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          ASM_QEMU_DEB="$RUNNER_TEMP/asm-qemu-user-static.deb"
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 120 \
            --output "$ASM_QEMU_DEB" \
            https://archive.ubuntu.com/ubuntu/pool/universe/q/qemu/qemu-user-static_8.2.2+ds-0ubuntu1.18_amd64.deb
          printf '%s  %s\n' 5bb397f66063efa349f6fd5cb3b68cd96f29edd0994e4ba5115cf0859a716bf0 "$ASM_QEMU_DEB" | sha256sum --check --strict
          test "$(dpkg-deb --field "$ASM_QEMU_DEB" Version)" = '1:8.2.2+ds-0ubuntu1.18'
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes "$ASM_QEMU_DEB"
          printf '%s  %s\n' be89e201dc6112ef101617ab575c95119ad123f80ca2b51b6c36ef218ac9df65 /usr/bin/qemu-riscv64-static | sha256sum --check --strict
          if ! test -e /proc/sys/fs/binfmt_misc/register; then
            sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          fi
          sudo /usr/lib/systemd/systemd-binfmt /usr/lib/binfmt.d/qemu-riscv64.conf
          grep -Fx 'interpreter /usr/libexec/qemu-binfmt/riscv64-binfmt-P' /proc/sys/fs/binfmt_misc/qemu-riscv64
          test "$(readlink -f /usr/libexec/qemu-binfmt/riscv64-binfmt-P)" = /usr/bin/qemu-riscv64-static
          grep -Eq '^flags: .*F' /proc/sys/fs/binfmt_misc/qemu-riscv64
          {
            uname -a
            docker version
            cat /proc/sys/fs/binfmt_misc/qemu-riscv64
            /usr/bin/qemu-riscv64-static --version
            dpkg-query --show qemu-user-static systemd
            sha256sum /usr/bin/qemu-riscv64-static
          } > "$ASM_EVIDENCE/environment.txt"
      - name: Observe the exact failed binary with unchanged assertions and limits
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/riscv64_server_observations.py --run-image \
            --image-zip "$ASM_INPUTS/image.zip" --server-zip "$ASM_INPUTS/server.zip" \
            --context "$ASM_CONTEXT" --output "$ASM_EVIDENCE"
      - name: Retain bounded observations from success or failure
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UNQUALIFIED-server-observations-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: server-observations-evidence/
          if-no-files-found: error
          retention-days: 14
