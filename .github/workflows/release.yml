name: Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the version tag
        run: |
          set -euo pipefail
          ASM_VERSION=$(python3 -c 'import json; print(json.load(open("cli/commands.json"))["version"])')
          ASM_COMMIT=$(git rev-parse HEAD)
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/v$ASM_VERSION"; then
            ASM_TAG_COMMIT=$(git rev-parse --verify "refs/tags/v$ASM_VERSION^{commit}")
            if [ "$ASM_TAG_COMMIT" != "$ASM_COMMIT" ]; then
              echo "The version tag identifies a different source commit." >&2
              exit 1
            fi
          fi
      - name: Install target verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y binutils-aarch64-linux-gnu binutils-riscv64-linux-gnu qemu-user
      - name: Check and build the release
        run: |
          make check
          python3 tools/release.py --output dist --hello-target x86_64-linux --hello-target aarch64-linux --hello-target riscv64-linux
      - name: Attest the build
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/asm-*
            dist/hello-*
            dist/math-*
            dist/SHA256SUMS
            dist/release.json
      - name: Verify release attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s failglob
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for ASM_ASSET in dist/asm-* dist/hello-* dist/math-* dist/SHA256SUMS dist/release.json; do
            test -f "$ASM_ASSET"
            test ! -L "$ASM_ASSET"
            gh attestation verify "$ASM_ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" \
              --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA" \
              --signer-digest "$GITHUB_WORKFLOW_SHA" \
              --deny-self-hosted-runners \
              --predicate-type https://slsa.dev/provenance/v1
          done
      - name: Publish a new immutable version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASM_VERSION=$(python3 -c 'import json; print(json.load(open("cli/commands.json"))["version"])')
          ASM_COMMIT=$(git rev-parse HEAD)
          test -f "docs/releases/$ASM_VERSION.md"
          gh release create "v$ASM_VERSION" dist/asm-* dist/hello-* dist/math-* dist/SHA256SUMS dist/release.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$ASM_COMMIT" \
            --title "ASM $ASM_VERSION" \
            --notes-file "docs/releases/$ASM_VERSION.md" \
            --prerelease
