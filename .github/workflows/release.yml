name: Release

on:
  workflow_dispatch:
    inputs:
      trusted_distribution:
        description: Bundle the verifier and require the provisioned Asm root
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    if: github.ref == 'refs/heads/main'
    name: Qualify the native macOS CLI
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: inputs.trusted_distribution
        with:
          go-version-file: verifier/go.mod
          cache-dependency-path: verifier/go.sum
      - name: Check the provisioned verifier
        if: inputs.trusted_distribution
        run: make verifier-test check-trust-root
      - name: Install Linux cross-build test tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install llvm lld
      - name: Build and test clean native release bytes
        env:
          ASM_TRUSTED: ${{ inputs.trusted_distribution }}
        run: |
          ASM_TRUSTED_FLAG=''
          if [ "$ASM_TRUSTED" = true ]; then ASM_TRUSTED_FLAG=--trusted-distribution; fi
          python3 tools/release.py --commit "$GITHUB_SHA" --native-target aarch64-macos --output native-dist $ASM_TRUSTED_FLAG
      - name: Retain exact native bytes and runtime evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-macos-${{ github.sha }}
          path: native-dist/*
          if-no-files-found: error
          retention-days: 7

  arm64:
    if: github.ref == 'refs/heads/main'
    name: Qualify the native ARM64 CLI
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: inputs.trusted_distribution
        with:
          go-version-file: verifier/go.mod
          cache-dependency-path: verifier/go.sum
      - name: Check the provisioned verifier
        if: inputs.trusted_distribution
        run: make verifier-test check-trust-root
      - name: Install Linux cross-build test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y binutils-x86-64-linux-gnu binutils-riscv64-linux-gnu qemu-user
      - name: Check the native ARM64 implementation
        run: make check
      - name: Check installation boundaries between users
        run: |
          sudo env PYTHONPATH=tests python3 -m unittest -v \
            test_self_update.SelfUpdateTests.test_cross_uid_writable_ancestor_attack_stops_before_any_tool \
            test_bootstrap.BootstrapUserFlowTests.test_other_uid_can_rename_unsafe_home_but_installer_rejects_that_ancestor \
            test_bootstrap.BootstrapUserFlowTests.test_readonly_home_allows_non_root_install_and_exact_rerun
      - name: Build and test exact native ARM64 release bytes
        shell: bash
        env:
          ASM_TRUSTED: ${{ inputs.trusted_distribution }}
        run: |
          set -euo pipefail
          ASM_TRUSTED_FLAG=''
          if [ "$ASM_TRUSTED" = true ]; then ASM_TRUSTED_FLAG=--trusted-distribution; fi
          # Root is needed only for the unchanged native cross-UID test suite.
          # The private source snapshots stay below this root-owned /tmp child.
          ASM_NATIVE_ROOT=$(sudo mktemp -d /tmp/asm-native-arm64.XXXXXXXX)
          test -d "$GITHUB_WORKSPACE/.git"
          test ! -L "$GITHUB_WORKSPACE/.git"
          sudo mkdir "$ASM_NATIVE_ROOT/repo"
          sudo cp -R "$GITHUB_WORKSPACE/.git" "$ASM_NATIVE_ROOT/repo/.git"
          sudo env -i PATH="$PATH" HOME=/root LANG=C.UTF-8 \
            python3 tools/release.py --repo "$ASM_NATIVE_ROOT/repo" --commit "$GITHUB_SHA" \
            --native-target aarch64-linux --output "$ASM_NATIVE_ROOT/native-dist" $ASM_TRUSTED_FLAG
          sudo rm -rf -- "$ASM_NATIVE_ROOT/repo"
          sudo chmod 755 "$ASM_NATIVE_ROOT"
          printf 'ASM_NATIVE_ARM_OUTPUT=%s/native-dist\n' "$ASM_NATIVE_ROOT" >> "$GITHUB_ENV"
      - name: Retain exact native ARM64 bytes and runtime evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-arm64-${{ github.sha }}
          path: ${{ env.ASM_NATIVE_ARM_OUTPUT }}/*
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build and qualify release bytes
    if: github.ref == 'refs/heads/main'
    needs: [arm64, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.handoff.outputs.manifest_sha256 }}
      artifact_id: ${{ steps.release_artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: inputs.trusted_distribution
        with:
          go-version-file: verifier/go.mod
          cache-dependency-path: verifier/go.sum
      - name: Check the provisioned verifier
        if: inputs.trusted_distribution
        run: make verifier-test check-trust-root
      - name: Check the version tag
        run: |
          set -euo pipefail
          ASM_VERSION=$(python3 -c 'import json; print(json.load(open("cli/commands.json"))["version"])')
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/v$ASM_VERSION"; then
            echo "This version tag already exists. Select a new immutable version." >&2
            exit 1
          fi
      - name: Install target verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y binutils-aarch64-linux-gnu binutils-riscv64-linux-gnu qemu-user
      - name: Receive the native macOS qualification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-macos-${{ github.sha }}
          path: native-input
      - name: Receive the native ARM64 qualification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-arm64-${{ github.sha }}
          path: native-arm64-input
      - name: Check and build the release
        env:
          ASM_TRUSTED: ${{ inputs.trusted_distribution }}
        run: |
          set -euo pipefail
          ASM_TRUSTED_FLAG=''
          if [ "$ASM_TRUSTED" = true ]; then ASM_TRUSTED_FLAG=--trusted-distribution; fi
          make check
          # Root runs every native cross-UID test on the final clean x86 bytes.
          ASM_RELEASE_ROOT=$(sudo mktemp -d /tmp/asm-release-x86.XXXXXXXX)
          test -d "$GITHUB_WORKSPACE/.git"
          test ! -L "$GITHUB_WORKSPACE/.git"
          sudo mkdir "$ASM_RELEASE_ROOT/repo"
          sudo cp -R "$GITHUB_WORKSPACE/.git" "$ASM_RELEASE_ROOT/repo/.git"
          sudo env -i PATH="$PATH" HOME=/root LANG=C.UTF-8 \
            python3 tools/release.py --repo "$ASM_RELEASE_ROOT/repo" --commit "$GITHUB_SHA" \
            --output "$ASM_RELEASE_ROOT/dist" --qualify-x86 \
            --native-input "$GITHUB_WORKSPACE/native-input" \
            --native-input-for aarch64-linux "$GITHUB_WORKSPACE/native-arm64-input" \
            --hello-target x86_64-linux --hello-target aarch64-linux --hello-target riscv64-linux $ASM_TRUSTED_FLAG
          sudo rm -rf -- "$ASM_RELEASE_ROOT/repo"
          sudo chmod 755 "$ASM_RELEASE_ROOT"
          printf 'ASM_RELEASE_OUTPUT=%s/dist\n' "$ASM_RELEASE_ROOT" >> "$GITHUB_ENV"
      - name: Check installation boundaries between users
        run: |
          sudo env PYTHONPATH=tests python3 -m unittest -v \
            test_self_update.SelfUpdateTests.test_cross_uid_writable_ancestor_attack_stops_before_any_tool \
            test_bootstrap.BootstrapUserFlowTests.test_other_uid_can_rename_unsafe_home_but_installer_rejects_that_ancestor \
            test_bootstrap.BootstrapUserFlowTests.test_readonly_home_allows_non_root_install_and_exact_rerun
      - name: Bind the qualified release manifest
        id: handoff
        run: |
          set -euo pipefail
          test "$(stat -c %s "$ASM_RELEASE_OUTPUT/release.json")" -le 1048576
          ASM_MANIFEST_SHA256=$(sha256sum "$ASM_RELEASE_OUTPUT/release.json" | cut -d ' ' -f1)
          printf 'manifest_sha256=%s\n' "$ASM_MANIFEST_SHA256" >> "$GITHUB_OUTPUT"
      - name: Retain only the qualified publication bytes
        id: release_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualified-release-${{ github.sha }}
          path: |
            ${{ env.ASM_RELEASE_OUTPUT }}/asm-*
            ${{ env.ASM_RELEASE_OUTPUT }}/hello-*
            ${{ env.ASM_RELEASE_OUTPUT }}/math-*
            ${{ env.ASM_RELEASE_OUTPUT }}/SHA256SUMS
            ${{ env.ASM_RELEASE_OUTPUT }}/release.json
            ${{ env.ASM_RELEASE_OUTPUT }}/install.sh
          if-no-files-found: error
          retention-days: 7

  release:
    name: Sign and publish qualified bytes
    if: github.ref == 'refs/heads/main' && github.repository == 'stubbi/asm'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the version tag
        run: |
          set -euo pipefail
          ASM_VERSION=$(python3 -c 'import json; print(json.load(open("cli/commands.json"))["version"])')
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/v$ASM_VERSION"; then
            echo "This version tag already exists. Select a new immutable version." >&2
            exit 1
          fi
      - name: Receive only this run's qualified release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Validate the handoff without executing artifacts
        env:
          ASM_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
          ASM_TRUSTED: ${{ inputs.trusted_distribution }}
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ASM_TRUSTED_FLAG=''
          if [ "$ASM_TRUSTED" = true ]; then ASM_TRUSTED_FLAG=--trusted-distribution; fi
          python3 tools/release.py --commit "$GITHUB_SHA" --validate-release dist \
            --manifest-sha256 "$ASM_MANIFEST_SHA256" $ASM_TRUSTED_FLAG
      - name: Install the provenance verifier
        shell: bash
        run: |
          set -euo pipefail
          ASM_GH_ROOT="$RUNNER_TEMP/asm-gh"
          mkdir -m 700 "$ASM_GH_ROOT"
          curl -q --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 120 \
            --max-filesize 15031972 \
            https://github.com/cli/cli/releases/download/v2.103.3/gh_2.103.3_linux_amd64.tar.gz \
            --output "$ASM_GH_ROOT/gh.tar.gz"
          test "$(stat -c %s "$ASM_GH_ROOT/gh.tar.gz")" = 15031972
          printf '%s  %s\n' \
            4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d \
            "$ASM_GH_ROOT/gh.tar.gz" | sha256sum --check --status
          tar --extract --gzip --file "$ASM_GH_ROOT/gh.tar.gz" \
            --directory "$ASM_GH_ROOT" gh_2.103.3_linux_amd64/bin/gh
          chmod 755 "$ASM_GH_ROOT/gh_2.103.3_linux_amd64/bin/gh"
          "$ASM_GH_ROOT/gh_2.103.3_linux_amd64/bin/gh" version
          printf '%s\n' "$ASM_GH_ROOT/gh_2.103.3_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Attest the build
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          create-storage-record: false
          subject-path: |
            dist/asm-*
            dist/hello-*
            dist/math-*
            dist/SHA256SUMS
            dist/release.json
      - name: Retain the signed bundle
        env:
          ASM_BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -f "$ASM_BUNDLE_PATH"
          test ! -L "$ASM_BUNDLE_PATH"
          test "$(stat -c %s "$ASM_BUNDLE_PATH")" -le 1048576
          python3 -c 'import json, os; b=json.load(open(os.environ["ASM_BUNDLE_PATH"])); assert isinstance(b, dict) and isinstance(b.get("dsseEnvelope"), dict)'
          install -m 644 "$ASM_BUNDLE_PATH" dist/release-attestation.sigstore.json
      - name: Verify release attestations without an account
        shell: bash
        run: |
          set -euo pipefail
          shopt -s failglob
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = stubbi/asm
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          ASM_VERIFY_HOME="$RUNNER_TEMP/asm-release-verifier"
          mkdir -m 700 "$ASM_VERIFY_HOME"
          for ASM_ASSET in dist/asm-* dist/hello-* dist/math-* dist/SHA256SUMS dist/release.json; do
            test -f "$ASM_ASSET"
            test ! -L "$ASM_ASSET"
            ASM_VERIFIED_ID=$(env -i \
              HOME="$ASM_VERIFY_HOME" \
              GH_CONFIG_DIR="$ASM_VERIFY_HOME/config" \
              XDG_CACHE_HOME="$ASM_VERIFY_HOME/cache" \
              GH_PROMPT_DISABLED=1 GH_NO_UPDATE_NOTIFIER=1 \
              GH_NO_EXTENSION_UPDATE_NOTIFIER=1 PATH=/usr/bin:/bin \
              "$RUNNER_TEMP/asm-gh/gh_2.103.3_linux_amd64/bin/gh" \
              attestation verify "$ASM_ASSET" \
              --bundle dist/release-attestation.sigstore.json \
              --repo stubbi/asm \
              --cert-identity https://github.com/stubbi/asm/.github/workflows/release.yml@refs/heads/main \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA" \
              --signer-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners \
              --predicate-type https://slsa.dev/provenance/v1 \
              --hostname github.com \
              --format json \
              --jq '.[].verificationResult.signature.certificate.sourceRepositoryIdentifier')
            test "$ASM_VERIFIED_ID" = 1441332955
          done
      - name: Publish a new immutable version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASM_VERSION=$(python3 -c 'import json; print(json.load(open("cli/commands.json"))["version"])')
          ASM_COMMIT=$(git rev-parse HEAD)
          test -f "docs/releases/$ASM_VERSION.md"
          ASM_EXTRA_ASSETS=()
          if [ -f dist/install.sh ]; then ASM_EXTRA_ASSETS+=(dist/install.sh); fi
          gh release create "v$ASM_VERSION" dist/asm-* dist/hello-* dist/math-* dist/SHA256SUMS dist/release.json dist/release-attestation.sigstore.json "${ASM_EXTRA_ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$ASM_COMMIT" \
            --title "asm $ASM_VERSION" \
            --notes-file "docs/releases/$ASM_VERSION.md" \
            --prerelease
