name: Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Commit or tag to build'
        required: true
        default: main
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install target verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y binutils-aarch64-linux-gnu binutils-riscv64-linux-gnu qemu-user
      - name: Check and build the release
        run: |
          make check
          python3 tools/release.py --output dist --hello-target x86_64-linux --hello-target aarch64-linux --hello-target riscv64-linux
      - name: Attest the build
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: |
            dist/asm-*
            dist/hello-*
            dist/math-*
            dist/SHA256SUMS
            dist/release.json
      - name: Publish a new immutable version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASM_VERSION=$(python3 -c 'import json; print(json.load(open("cli/commands.json"))["version"])')
          ASM_COMMIT=$(git rev-parse HEAD)
          test -f "docs/releases/$ASM_VERSION.md"
          gh release create "v$ASM_VERSION" dist/asm-* dist/hello-* dist/math-* dist/SHA256SUMS dist/release.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$ASM_COMMIT" \
            --title "ASM $ASM_VERSION" \
            --notes-file "docs/releases/$ASM_VERSION.md" \
            --prerelease
