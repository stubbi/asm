name: Qualify the Intel macOS port
on:
  pull_request:
  push:
    branches: [main, codex/intel-macos-cli]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: intel-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  intel-macos:
    name: Check the native Intel macOS CLI
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux cross-build test tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install llvm lld
      - name: Check exact-source snapshot binding
        run: |
          set -euo pipefail
          mkdir -p native-intel-checks
          python3 -m unittest discover -s tests/registry -p test_intel_qualification_source.py -v \
            2>&1 | tee native-intel-checks/source-tests.log
      - name: Build twice and test exact native Intel bytes
        run: python3 tools/qualify_macos_x86_64.py --commit "$GITHUB_SHA" --output native-intel
      - name: Retain qualification results and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-intel-evidence-${{ github.sha }}
          path: |
            native-intel-checks/*.log
            native-intel/*.log
            native-intel/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain the qualified executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-intel-${{ github.sha }}
          path: native-intel/asm-*
          if-no-files-found: error
          retention-days: 7
