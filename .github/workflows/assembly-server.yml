# Temporary diagnostic only. Restore the workflow from commit
# 5992c3016f6a0ba972665054b5b4856659336d31 after the selected native RED run.
# Original workflow blob: 3b209e45bae4b61032ba906005664173ebd19c3f.
name: Assembly server admission RED (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assembly-server-admission-red-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-red:
    name: Inspect eight-reader admission (AMD64 native)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record diagnostic source and host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)/$(uname -m)" = Linux/x86_64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -m 700 "$RUNNER_TEMP/asm-admission-red-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/asm-admission-red-evidence/source-revision.txt"
          sha256sum server/runtime.s server/config.s server/abi-check.c server/Makefile \
            server/catalog/reader-guard.sql server/catalog/read-exports.sql \
            server/test_runtime.py server/test_capacity.py .github/workflows/assembly-server.yml \
            > "$RUNNER_TEMP/asm-admission-red-evidence/source-files.sha256"
          { uname -a; gcc --version; python3 --version; openssl version; } \
            > "$RUNNER_TEMP/asm-admission-red-evidence/host-tools.txt"
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential bison flex bzip2 libssl-dev
      - name: Fetch and check the pinned source archives
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          ASM_DEPS="$RUNNER_TEMP/asm-server-reference"
          mkdir -m 700 "$ASM_DEPS"
          mkdir "$ASM_DEPS/downloads" "$ASM_DEPS/tmp"

          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 120 \
            --output "$ASM_DEPS/downloads/libmicrohttpd-1.0.3.tar.gz" \
            https://ftp.gnu.org/gnu/libmicrohttpd/libmicrohttpd-1.0.3.tar.gz
          printf '%s  %s\n' \
            7816b57aae199cf5c3645e8770e1be5f0a4dfafbcb24b3772173dc4ee634126a \
            "$ASM_DEPS/downloads/libmicrohttpd-1.0.3.tar.gz" | sha256sum --check --strict

          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 120 \
            --output "$ASM_DEPS/downloads/postgresql-16.15.tar.bz2" \
            https://ftp.postgresql.org/pub/source/v16.15/postgresql-16.15.tar.bz2
          printf '%s  %s\n' \
            c1575341fa7bd40f5274ea465b34390f4dc64cdd0770af327005caaeb9f6b7ed \
            "$ASM_DEPS/downloads/postgresql-16.15.tar.bz2" | sha256sum --check --strict

          tar -xzf "$ASM_DEPS/downloads/libmicrohttpd-1.0.3.tar.gz" -C "$ASM_DEPS"
          tar -xjf "$ASM_DEPS/downloads/postgresql-16.15.tar.bz2" -C "$ASM_DEPS"
      - name: Build libmicrohttpd
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          ASM_DEPS="$RUNNER_TEMP/asm-server-reference"
          cd "$ASM_DEPS/libmicrohttpd-1.0.3"
          TMPDIR="$ASM_DEPS/tmp" ./configure --prefix="$ASM_DEPS/mhd" \
            --disable-https --disable-examples --disable-doc --disable-tools \
            --disable-curl --disable-static
          make -j2
          make install
      - name: Build PostgreSQL and libpq
        shell: bash
        timeout-minutes: 18
        run: |
          set -euo pipefail
          ASM_DEPS="$RUNNER_TEMP/asm-server-reference"
          cd "$ASM_DEPS/postgresql-16.15"
          TMPDIR="$ASM_DEPS/tmp" ./configure --prefix="$ASM_DEPS/postgres" \
            --with-openssl --without-readline --without-zlib --without-icu --without-lz4 --without-zstd
          make -j2
          make install
      - name: Run the existing sixteen canonical runtime tests
        id: basics
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          ASM_DEPS="$RUNNER_TEMP/asm-server-reference"
          ASM_EVIDENCE="$RUNNER_TEMP/asm-admission-red-evidence"
          set +e
          make -C server test TARGET=x86_64-linux \
            BUILD="$RUNNER_TEMP/asm-admission-red-build" SOURCE_REVISION="$GITHUB_SHA" \
            MHD_PREFIX="$ASM_DEPS/mhd" PG_PREFIX="$ASM_DEPS/postgres" \
            2>&1 | tee "$ASM_EVIDENCE/basics.log"
          ASM_STATUS=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${ASM_STATUS[0]}" > "$ASM_EVIDENCE/basics.exit"
          test "${ASM_STATUS[1]}" -eq 0
          exit "${ASM_STATUS[0]}"
      - name: Observe the candidate capacity result without retry
        id: capacity
        if: ${{ !cancelled() && (steps.basics.outcome == 'success' || steps.basics.outcome == 'failure') }}
        shell: bash
        timeout-minutes: 1
        run: |
          set -euo pipefail
          ASM_DEPS="$RUNNER_TEMP/asm-server-reference"
          ASM_EVIDENCE="$RUNNER_TEMP/asm-admission-red-evidence"
          export ASM_SERVER_BINARY="$RUNNER_TEMP/asm-admission-red-build/asm-hub"
          export ASM_SERVER_SOURCE_REVISION="$GITHUB_SHA"
          export ASM_PROTO_LIBPQ="$ASM_DEPS/postgres/lib/libpq.so.5"
          export ASM_PROTO_PG_BINDIR="$ASM_DEPS/postgres/bin"
          set +e
          python3 server/test_capacity.py 2>&1 | tee "$ASM_EVIDENCE/capacity.log"
          ASM_STATUS=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${ASM_STATUS[0]}" > "$ASM_EVIDENCE/capacity.exit"
          test "${ASM_STATUS[1]}" -eq 0
          exit "${ASM_STATUS[0]}"
      - name: Record outcomes and the exact diagnostic executable
        if: always()
        shell: bash
        env:
          ASM_BASICS_OUTCOME: ${{ steps.basics.outcome }}
          ASM_CAPACITY_OUTCOME: ${{ steps.capacity.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asm-admission-red-evidence"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          binary = Path(os.environ["RUNNER_TEMP"]) / "asm-admission-red-build/asm-hub"
          record = {
              "source_revision": os.environ["GITHUB_SHA"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "workflow_revision": os.environ["GITHUB_WORKFLOW_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "target": "x86_64-linux",
              "execution": "native",
              "basics_outcome": os.environ["ASM_BASICS_OUTCOME"],
              "capacity_outcome": os.environ["ASM_CAPACITY_OUTCOME"],
              "expected_red_assertion": "The ninth request opened another database connection.",
              "classification": "Inspect raw logs; a setup, timing, or fixture failure is not the expected native RED.",
              "binary": {"present": binary.is_file()},
          }
          if binary.is_file():
              record["binary"].update(bytes=binary.stat().st_size,
                                      sha256=hashlib.sha256(binary.read_bytes()).hexdigest())
          output = Path(os.environ["RUNNER_TEMP"]) / "asm-admission-red-evidence/outcomes.json"
          output.write_text(json.dumps(record, indent=2) + "\n")
          PY
      - name: Retain successful checks and all failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admission-red-amd64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/asm-admission-red-evidence/
            ${{ runner.temp }}/asm-admission-red-build/asm-hub
          if-no-files-found: error
          retention-days: 7
