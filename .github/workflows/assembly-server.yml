name: Assembly server

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assembly-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test package and runtime (${{ matrix.target }}, native)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-linux }
          - { runner: ubuntu-24.04-arm, target: aarch64-linux }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ASM_TEST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential bison flex bzip2 libssl-dev
      - name: Fetch and check the pinned source archives
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          ASM_DEPS="$RUNNER_TEMP/asm-server-reference"
          mkdir -m 700 "$ASM_DEPS"
          mkdir "$ASM_DEPS/downloads" "$ASM_DEPS/tmp"

          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 120 \
            --output "$ASM_DEPS/downloads/libmicrohttpd-1.0.3.tar.gz" \
            https://ftp.gnu.org/gnu/libmicrohttpd/libmicrohttpd-1.0.3.tar.gz
          printf '%s  %s\n' \
            7816b57aae199cf5c3645e8770e1be5f0a4dfafbcb24b3772173dc4ee634126a \
            "$ASM_DEPS/downloads/libmicrohttpd-1.0.3.tar.gz" | sha256sum --check --strict

          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 120 \
            --output "$ASM_DEPS/downloads/postgresql-16.15.tar.bz2" \
            https://ftp.postgresql.org/pub/source/v16.15/postgresql-16.15.tar.bz2
          printf '%s  %s\n' \
            c1575341fa7bd40f5274ea465b34390f4dc64cdd0770af327005caaeb9f6b7ed \
            "$ASM_DEPS/downloads/postgresql-16.15.tar.bz2" | sha256sum --check --strict

          tar -xzf "$ASM_DEPS/downloads/libmicrohttpd-1.0.3.tar.gz" -C "$ASM_DEPS"
          tar -xjf "$ASM_DEPS/downloads/postgresql-16.15.tar.bz2" -C "$ASM_DEPS"
      - name: Build libmicrohttpd
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          ASM_DEPS="$RUNNER_TEMP/asm-server-reference"
          cd "$ASM_DEPS/libmicrohttpd-1.0.3"
          TMPDIR="$ASM_DEPS/tmp" ./configure --prefix="$ASM_DEPS/mhd" \
            --disable-https --disable-examples --disable-doc --disable-tools \
            --disable-curl --disable-static
          make -j2
          make install
      - name: Build PostgreSQL and libpq
        shell: bash
        timeout-minutes: 18
        run: |
          set -euo pipefail
          ASM_DEPS="$RUNNER_TEMP/asm-server-reference"
          cd "$ASM_DEPS/postgresql-16.15"
          TMPDIR="$ASM_DEPS/tmp" ./configure --prefix="$ASM_DEPS/postgres" \
            --with-openssl --without-readline --without-zlib --without-icu --without-lz4 --without-zstd
          make -j2
          make install
      - name: Build the native Asm CLI
        run: make
      - name: Exercise native-library CLI builds and failures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/server-port-evidence"
          PYTHONPATH=tests python3 -m unittest test_native_link -v \
            2>&1 | tee "$RUNNER_TEMP/server-port-evidence/native-link-tests.log"
      - name: Package the server source
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/assembly-server/package.py --target "$ASM_TEST_TARGET" \
            --output "$RUNNER_TEMP/asm-server-project"
          python3 tools/registry.py pack "$RUNNER_TEMP/asm-server-project" \
            --name stubbi/asm-server --version 0.1.0 --target "$ASM_TEST_TARGET" \
            --output "$RUNNER_TEMP/asm-server-source.tar.gz"
          mkdir "$RUNNER_TEMP/asm-server-source"
          tar -xzf "$RUNNER_TEMP/asm-server-source.tar.gz" -C "$RUNNER_TEMP/asm-server-source"
      - name: Build and test the extracted server package
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          ASM_DEPS="$RUNNER_TEMP/asm-server-reference"
          make -C "$RUNNER_TEMP/asm-server-source" test \
            ASM="$GITHUB_WORKSPACE/build/asm" \
            MHD_PREFIX="$ASM_DEPS/mhd" \
            PG_PREFIX="$ASM_DEPS/postgres" \
            2>&1 | tee "$RUNNER_TEMP/server-port-evidence/reference-tests.log"
      - name: Test the hosted assembly runtime foundation
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          ASM_DEPS="$RUNNER_TEMP/asm-server-reference"
          make -C server test TARGET="$ASM_TEST_TARGET" \
            BUILD="$RUNNER_TEMP/hosted-server-build" SOURCE_REVISION="$GITHUB_SHA" \
            MHD_PREFIX="$ASM_DEPS/mhd" PG_PREFIX="$ASM_DEPS/postgres" \
            2>&1 | tee "$RUNNER_TEMP/server-port-evidence/hosted-tests.log"
      - name: Check build failure preserves both executables
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_server_build_failures.py \
            --reference "$RUNNER_TEMP/asm-server-source" \
            --hosted "$GITHUB_WORKSPACE/server" \
            --hosted-build "$RUNNER_TEMP/hosted-server-build" \
            --asm "$GITHUB_WORKSPACE/build/asm" --target "$ASM_TEST_TARGET" \
            --mhd-prefix "$RUNNER_TEMP/asm-server-reference/mhd" \
            --pg-prefix "$RUNNER_TEMP/asm-server-reference/postgres" \
            --revision "$GITHUB_SHA" \
            2>&1 | tee "$RUNNER_TEMP/server-port-evidence/build-failure-tests.log"
      - name: Record target artifact identities
        if: always()
        shell: bash
        env:
          ASM_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/server-port-evidence"
          python3 tools/record_server_ports.py \
            --target "$ASM_TEST_TARGET" --execution native --revision "$GITHUB_SHA" \
            --job-status "$ASM_JOB_STATUS" --asm "$GITHUB_WORKSPACE/build/asm" \
            --reference "$RUNNER_TEMP/asm-server-source/build/app" \
            --hosted "$RUNNER_TEMP/hosted-server-build/asm-hub" \
            --archive "$RUNNER_TEMP/asm-server-source.tar.gz" \
            --output "$RUNNER_TEMP/server-port-evidence/qualification.json"
      - name: Retain passed and failed port evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-port-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/server-port-evidence/
            ${{ github.workspace }}/build/asm
            ${{ runner.temp }}/asm-server-source/build/app
            ${{ runner.temp }}/hosted-server-build/asm-hub
            ${{ runner.temp }}/asm-server-source.tar.gz
          if-no-files-found: error
          retention-days: 7
