name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Package documentation comes from each release's pinned source commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Check whether this source already passed
        id: source
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASM_REUSE=false
          # Only scheduled refreshes can reuse the latest exact-source push check.
          # API errors and all other results retain the full check below.
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            ASM_EXPECTED=$(printf '%s\tmain\tpush\tcompleted\tsuccess\t.github/workflows/ci.yml\t%s' "$GITHUB_SHA" "$GITHUB_REPOSITORY")
            if ASM_RESULT=$(timeout 30s gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=1" \
              --jq 'if (.workflow_runs | length) == 1 then .workflow_runs[0] | [.head_sha,.head_branch,.event,.status,.conclusion,.path,.repository.full_name] | @tsv else "" end') &&
              [ "$ASM_RESULT" = "$ASM_EXPECTED" ]; then
              ASM_REUSE=true
            fi
          fi
          printf 'reuse=%s\n' "$ASM_REUSE" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: steps.source.outputs.reuse != 'true'
        with:
          go-version-file: verifier/go.mod
          cache-dependency-path: verifier/go.sum
      - name: Install cross-architecture verification tools
        if: steps.source.outputs.reuse != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y binutils-aarch64-linux-gnu binutils-riscv64-linux-gnu qemu-user
      - name: Check the site and registry
        if: steps.source.outputs.reuse != 'true'
        run: make check
      - name: Check the refreshed site
        if: steps.source.outputs.reuse == 'true'
        run: make site-test
      - name: Restore public metadata caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            build/discovery-state
            build/repository-state
          key: asm-publication-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            asm-publication-v1-${{ runner.os }}-
      - name: Build and check published artifacts
        run: python3 tools/build_site.py --output .pages --verify-artifacts --refresh-publications --publication-state build/discovery-state/history.sqlite3 --refresh-repository --repository-state build/repository-state/github.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .pages
          # build_site permits only reviewed public hidden paths.
          include-hidden-files: true
      - name: Check the archived security contact
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tarfile
          expected = Path(".pages/.well-known/security.txt").read_bytes()
          with tarfile.open(Path(os.environ["RUNNER_TEMP"]) / "artifact.tar") as archive:
              actual = archive.extractfile("./.well-known/security.txt")
              assert actual is not None, "security contact missing from Pages archive"
              assert actual.read(len(expected) + 1) == expected, "archived security contact differs"
          PY
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  verify-install:
    name: Check the published installer (${{ matrix.target }})
    needs: deploy
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-linux
          - runner: ubuntu-24.04-arm
            target: aarch64-linux
          - runner: macos-15
            target: aarch64-macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check native installer gate tests
        run: python3 -m unittest discover -s tests/release -p test_published_install.py -v
      - name: Install the published command and run the first project
        run: python3 tools/check_published_install.py --expected-target "${{ matrix.target }}" --expected-site-commit "$GITHUB_SHA" --output build/published-install/evidence.json
      - name: Retain published installation results and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-install-${{ matrix.target }}-${{ github.sha }}
          path: build/published-install/evidence.json
          if-no-files-found: error
          retention-days: 90
